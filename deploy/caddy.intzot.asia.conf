# ===============================================================
# intzot.asia 的 caddy 站点块
#
# 现状：80/443 由另一个项目的 caddy 容器占用（~/nefu-pa-web），
#       它服务 nefupa.intzot.asia。博客要接入，必须经它转发。
#       在你确认之前，这个文件不会被应用——只是准备好。
#
# 两种接入方式，选一种（详见仓库 README 的部署一节）：
#
# ---------------------------------------------------------------
# 方式一：给 caddy 容器加一个只读挂载，由它直接发静态文件
#
#   1. 在 ~/nefu-pa-web/docker-compose.yml 的 caddy.volumes 里加一行：
#
#        - /srv/intzot.asia/current:/srv/blog:ro
#
#   2. 在 ~/nefu-pa-web/caddy/Caddyfile 末尾追加下面这段
#   3. 先校验：docker exec nefu-pa-web-caddy-1 caddy validate --config /etc/caddy/Caddyfile
#   4. 再应用：cd ~/nefu-pa-web && docker compose up -d caddy
#      （会重建容器，nefu 站中断约 3-5 秒）
#
#   优点：不引入多余进程。缺点：那几秒的中断。
#
# ---------------------------------------------------------------
# 方式二：宿主机上跑一个静态服务，caddy 反代过去
#
#   只改 Caddyfile，把下面 root/file_server 换成：
#       reverse_proxy host.docker.internal:8081
#   然后热加载：docker exec nefu-pa-web-caddy-1 caddy reload --config /etc/caddy/Caddyfile
#
#   优点：零中断。缺点：多一个常驻进程（约 10MB）。
#
# ---------------------------------------------------------------
# 证书说明（2026-10-12 实测确认）：
#   http://intzot.asia 从国内访问会被阿里云以「未备案」拦截（403），
#   但证书仍然签得下来——实际用的是 **http-01** 挑战，不是 tls-alpn-01。
#
#   原因是：**备案拦截只作用于国内来源的流量**。Let's Encrypt 的校验
#   服务器在国外，它的请求直接落到这台机器上，所以 http-01 能通过。
#
#   推论：**续期也会成功**，不需要额外配置。
#   不要为了「先让国内 HTTP 能通」去改这里——那解决不了备案问题，
#   反而可能弄坏证书签发。
# ===============================================================

intzot.asia {
	encode zstd gzip
	root * /srv/blog
	file_server

	# 目录式链接：/posts/foo/ 直接命中 /posts/foo/index.html
	try_files {path} {path}/ {path}/index.html

	header {
		Strict-Transport-Security "max-age=31536000"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
	}

	# 静态资源长期缓存；HTML 不缓存，否则新文章发不出去
	@assets path /_astro/* /pagefind/*
	header @assets Cache-Control "public, max-age=31536000, immutable"

	@html path *.html /
	header @html Cache-Control "public, max-age=0, must-revalidate"

	log {
		output stdout
		format console
	}
}
